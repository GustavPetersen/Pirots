services:
  web:
    build: ./frontend
    depends_on: [pirots-api]
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
    networks: [default, dokploy-network]

  pirots-api:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    restart: unless-stopped
    networks: [default, dokploy-network]

networks:
  dokploy-network:
    external: true