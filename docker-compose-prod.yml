services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME} 
    restart: unless-stopped
    network: dokploy-network
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_NAME}"]
      interval: 5s

  api:
    build:
      context: ./backend
      target: production
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on: db
    restart: unless-stopped
    network: dokploy-network

  web:
    build:
      context: ./frontend
      target: production
    depends_on: api
    restart: unless-stopped
    network: dokploy-network

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
    restart: unless-stopped
    network: dokploy-network
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

networks:
  dokploy-network:
    external: true

volumes:
  pg_data:
  caddy_data:
  caddy_config:
