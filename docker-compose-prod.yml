services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME} 
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_NAME}"]
      interval: 5s

  api:
    image: 21philip/pirots-api:latest
    build:
      context: ./backend
      target: production
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on: [db]
    restart: unless-stopped

  web:
    image: 21philip/pirots-web:latest
    build:
      context: ./frontend
      target: production
    environment:
      - VITE_API_URL=https://pirots.goofyahh.dk/api
    depends_on: [api]
    restart: unless-stopped

  proxy:
    image: 21philip/pirots-proxy:latest
    build:
      context: ./proxy
      target: production
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  caddy_data:
  caddy_config:
