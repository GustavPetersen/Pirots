name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  COMPOSE_FILE_NAME: docker-compose-prod.yml
  DEPLOY_PATH: /home/ubuntu/app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Builds every service in the compose file that has a `build:` section
      # (api, web, proxy) using its context/target/args, and pushes the
      # resulting `image:` tags to Docker Hub.
      - uses: docker/bake-action@v6
        with:
          source: .
          files: ${{ env.COMPOSE_FILE_NAME }}
          push: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max
            proxy.cache-from=type=gha,scope=proxy
            proxy.cache-to=type=gha,scope=proxy,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 2. Overwrite the server's compose file with the version on main
      - name: Upload compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ${{ env.COMPOSE_FILE_NAME }}
          target: ${{ env.DEPLOY_PATH }}

      - name: Pull images and restart
        uses: appleboy/ssh-action@v1
        env:
          COMPOSE_FILE_NAME: ${{ env.COMPOSE_FILE_NAME }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: COMPOSE_FILE_NAME,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # 3. Pull the latest images from Docker Hub
            docker compose -f "$COMPOSE_FILE_NAME" pull

            # 4. Restart all containers on the new images
            docker compose -f "$COMPOSE_FILE_NAME" up -d --force-recreate --remove-orphans

            docker image prune -f
